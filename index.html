<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>Tank City</title>
  </head>
  <body>
    <div id="app">
      <header class="concept-header">
        <a class="brand" href="./"><img src="./favicon.svg" alt="" /> Tank City</a>
        <span class="concept-badge">ART DIRECTION / 01</span>
        <a href="./compare.html">Compare looks <span aria-hidden="true">↗</span></a>
      </header>
      <div id="stage"><canvas id="screen" aria-label="Tank City game. Arrow keys to move, space to fire, enter to start or pause."></canvas></div>
      <footer class="concept-footer"><span>SMALL TANKS. BIG COURAGE.</span><span>↑ ↓ ← → / WASD &nbsp; MOVE &nbsp; · &nbsp; SPACE &nbsp; FIRE &nbsp; · &nbsp; ENTER &nbsp; START</span></footer>
      <div id="controls">
        <div id="dpad"><span class="u"></span><span class="r"></span><span class="d"></span><span class="l"></span></div>
        <div class="buttons">
          <div class="btn small" data-key="start">START</div>
          <div class="btn" data-key="fire">FIRE</div>
        </div>
      </div>
    </div>
    <button id="mute" type="button">SOUND ON</button>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
